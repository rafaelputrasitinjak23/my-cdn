<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafael URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6;
            border-radius: 50%; width: 16px; height: 16px;
            animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800">

    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-8">
        
        <!-- Navbar Simple -->
        <div class="w-full max-w-lg flex justify-between items-center mb-6">
            <a href="/" class="text-sm font-medium text-gray-500 hover:text-blue-600 transition-colors flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke CDN
            </a>
            <span class="text-xs font-bold bg-blue-100 text-blue-600 py-1 px-2.5 rounded-full">Tools</span>
        </div>

        <!-- Card Utama -->
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-sm border border-gray-100 p-8">
            
            <div class="text-center mb-8">
                <div class="mx-auto w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center mb-4 border border-blue-100 shadow-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">URL Shortener</h1>
                <p class="text-sm text-gray-500 mt-1">Buat link panjang menjadi lebih rapi dan ringkas.</p>
            </div>

            <!-- Form -->
            <form id="shortenForm">
                <div class="mb-4">
                    <label for="longUrl" class="block text-sm font-medium text-gray-700 mb-1.5">Masukkan URL Panjang</label>
                    <input type="url" id="longUrl" placeholder="https://contoh.com/halaman-yang-sangat-panjang..." required
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-sm disabled:bg-blue-300 disabled:cursor-not-allowed">
                    Pendekkan URL
                </button>
            </form>

            <!-- Pesan Error -->
            <div id="errorMsg" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm font-medium rounded-xl border border-red-100 text-center"></div>

            <!-- Hasil Output Box -->
            <div id="resultBox" class="hidden mt-6 p-5 bg-gray-50 border border-gray-200 rounded-xl transition-all">
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Short URL Anda siap:</p>
                <div class="flex items-center justify-between bg-white border border-gray-200 rounded-lg p-2 shadow-sm">
                    <a href="#" id="shortUrlDisplay" target="_blank" class="text-blue-600 font-medium text-sm truncate pl-2 hover:underline"></a>
                    <button id="copyBtn" class="ml-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-1.5 px-3 rounded text-xs transition-colors whitespace-nowrap">
                        Copy
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center text-sm text-gray-400 p-6">
        &copy; 2026 Rafael Platform. All rights reserved.
    </footer>

    <script>
        const form = document.getElementById('shortenForm');
        const longUrlInput = document.getElementById('longUrl');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const shortUrlDisplay = document.getElementById('shortUrlDisplay');
        const copyBtn = document.getElementById('copyBtn');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = longUrlInput.value.trim();
            if (!url) return;

            // Atur UI ke mode loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="loader"></span> Memproses...`;
            errorMsg.classList.add('hidden');
            resultBox.classList.add('hidden');

            try {
                // Tembak API backend
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();

                if (response.ok) {
                    // Tampilkan hasil
                    shortUrlDisplay.href = data.shortUrl;
                    shortUrlDisplay.textContent = data.shortUrl;
                    resultBox.classList.remove('hidden');
                    longUrlInput.value = ''; // Bersihkan input
                } else {
                    // Tampilkan error dari server
                    errorMsg.textContent = '❌ ' + (data.error || 'Terjadi kesalahan.');
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = '❌ Gagal menghubungi server. Periksa koneksi internet Anda.';
                errorMsg.classList.remove('hidden');
            } finally {
                // Kembalikan tombol ke kondisi semula
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Pendekkan URL';
                
                // Reset tombol copy
                copyBtn.textContent = 'Copy';
                copyBtn.className = 'ml-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-1.5 px-3 rounded text-xs transition-colors whitespace-nowrap';
            }
        });

        // Fungsi Copy ke Clipboard
        copyBtn.addEventListener('click', () => {
            const urlToCopy = shortUrlDisplay.href;
            navigator.clipboard.writeText(urlToCopy).then(() => {
                copyBtn.textContent = 'Copied! ✓';
                copyBtn.className = 'ml-3 bg-green-100 text-green-700 font-medium py-1.5 px-3 rounded text-xs transition-colors whitespace-nowrap';
                
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.className = 'ml-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-1.5 px-3 rounded text-xs transition-colors whitespace-nowrap';
                }, 2000);
            }).catch(() => {
                alert('Gagal menyalin URL');
            });
        });
    </script>
</body>
</html>
